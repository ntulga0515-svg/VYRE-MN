<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skinchanger — VYRE.MN</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070707;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .skins-page {
            margin-left: 240px;
            padding: 35px;
            min-height: 100vh;
        }

        .skins-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .skins-title h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 2px;
        }

        .skins-title p {
            margin: 7px 0 0;
            color: #777;
            font-size: 13px;
        }

        .search-box {
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #252525;
            border-radius: 8px;
            outline: none;
            background: #101010;
            color: white;
        }

        .search-box input:focus {
            border-color: #555;
        }

        .top-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .control-btn {
            border: 1px solid #242424;
            background: #101010;
            color: #aaa;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            transition: .15s;
        }

        .control-btn:hover {
            color: white;
            border-color: #444;
        }

        .control-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .weapon-bar {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            max-height: 130px;
            overflow-y: auto;
            padding: 4px 0 15px;
            margin-bottom: 15px;
        }

        .weapon-bar button {
            background: #0e0e0e;
            color: #888;
            border: 1px solid #202020;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .weapon-bar button:hover {
            color: #fff;
            border-color: #444;
        }

        .weapon-bar button.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .main-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 20px;
            align-items: start;
        }

        .items-panel {
            min-width: 0;
        }

        #skinGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .skin-card {
            border: 1px solid #202020;
            background: #0d0d0d;
            border-radius: 9px;
            padding: 10px;
            text-align: left;
            color: white;
            cursor: pointer;
            transition: .15s;
            min-width: 0;
        }

        .skin-card:hover {
            border-color: #555;
            transform: translateY(-2px);
            background: #111;
        }

        .skin-image {
            height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #090909;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .skin-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .skin-image span {
            color: #444;
            font-size: 10px;
        }

        .skin-name {
            font-size: 12px;
            line-height: 1.35;
            color: #ddd;
        }

        .skin-weapon {
            margin-top: 5px;
            color: #666;
            font-size: 10px;
        }

        .side-panel {
            position: sticky;
            top: 25px;
            background: #0d0d0d;
            border: 1px solid #202020;
            border-radius: 10px;
            padding: 16px;
        }

        .side-title {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #777;
            margin-bottom: 12px;
        }

        .selected-preview {
            height: 180px;
            background: #080808;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 12px;
        }

        #selectedImage {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #selectedName {
            font-size: 13px;
            color: #ddd;
            min-height: 35px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .action-buttons button {
            padding: 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        #saveSkin {
            background: #fff;
            color: #000;
            border: 1px solid #fff;
        }

        #removeSkin {
            background: #111;
            color: #aaa;
            border: 1px solid #292929;
        }

        #removeSkin:hover {
            color: white;
            border-color: #555;
        }

        .saved-section {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #202020;
        }

        .saved-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            margin-bottom: 7px;
            background: #101010;
            border-radius: 7px;
        }

        .saved-item img {
            width: 55px;
            height: 40px;
            object-fit: contain;
        }

        .saved-item strong {
            display: block;
            color: #ddd;
            font-size: 10px;
            line-height: 1.3;
        }

        .saved-item small {
            display: block;
            margin-top: 3px;
            color: #555;
            font-size: 8px;
        }

        .empty-loadout {
            color: #444;
            font-size: 10px;
            padding: 10px 0;
        }

        @media (max-width: 1100px) {
            .skins-page {
                margin-left: 0;
                padding: 25px;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .side-panel {
                position: static;
            }
        }

        @media (max-width: 700px) {
            .skins-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            #skinGrid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        VYRE<span>.MN</span>
    </div>

    <nav>

        <a href="/" class="nav-item">
            <span>⌂</span>
            HOME
        </a>

        <a href="/servers" class="nav-item">
            <span>◈</span>
            SERVERS
        </a>

        <a href="/skins" class="nav-item active">
            <span>◉</span>
            SKINCHANGER
        </a>

        <a href="/leaderboard" class="nav-item">
            <span>♛</span>
            LEADERBOARD
        </a>

        <a href="/players" class="nav-item">
            <span>♙</span>
            PLAYERS
        </a>

        <a href="/clans" class="nav-item">
            <span>◆</span>
            CLANS
        </a>

        <a
            href="https://discord.gg/mAa7dct57"
            target="_blank"
            rel="noopener noreferrer"
            class="nav-item"
        >
            <span>◌</span>
            DISCORD
        </a>

        <a href="/profile" class="nav-item">
            <span>◉</span>
            PROFILE
        </a>

    </nav>

</aside>


<!-- MAIN -->

<main class="skins-page">

    <div class="skins-header">

        <div class="skins-title">
            <h1>SKINCHANGER</h1>
            <p>CS2 LOADOUT CONFIGURATION</p>
        </div>

        <div class="search-box">
            <input
                id="skinSearch"
                type="text"
                placeholder="Search skins..."
                autocomplete="off"
            >
        </div>

    </div>


    <!-- TEAM -->

    <div class="top-controls">

        <button
            class="control-btn active"
            data-team="all"
        >
            ALL
        </button>

        <button
            class="control-btn"
            data-team="t"
        >
            T
        </button>

        <button
            class="control-btn"
            data-team="ct"
        >
            CT
        </button>

    </div>


    <!-- TABS -->

    <div class="top-controls">

        <button
            class="control-btn active"
            data-tab="skins"
        >
            SKINS
        </button>

        <button
            class="control-btn"
            data-tab="agents"
        >
            AGENTS
        </button>

        <button
            class="control-btn"
            data-tab="music"
        >
            MUSIC KIT
        </button>

        <button
            class="control-btn"
            data-tab="medals"
        >
            MEDALS
        </button>

    </div>


    <!-- WEAPONS -->

    <div
        id="weaponBar"
        class="weapon-bar"
    ></div>


    <!-- CONTENT -->

    <div class="main-layout">

        <section class="items-panel">

            <div id="skinGrid">
                <div style="padding:30px;color:#555;">
                    LOADING CS2 ITEMS...
                </div>
            </div>

        </section>


        <!-- RIGHT PANEL -->

        <aside class="side-panel">

            <div class="side-title">
                SELECTED ITEM
            </div>

            <div class="selected-preview">

                <img
                    id="selectedImage"
                    src=""
                    alt=""
                    style="display:none;"
                >

            </div>

            <div id="selectedName">
                NO ITEM SELECTED
            </div>


            <div class="action-buttons">

                <button
                    id="saveSkin"
                    type="button"
                >
                    SAVE
                </button>

                <button
                    id="removeSkin"
                    type="button"
                >
                    REMOVE
                </button>

            </div>


            <div class="saved-section">

                <div class="side-title">
                    SAVED LOADOUT
                </div>

                <div id="savedLoadout">

                    <div class="empty-loadout">
                        NO SAVED LOADOUT
                    </div>

                </div>

            </div>

        </aside>

    </div>

</main>


<script src="/skins.js"></script>

</body>
</html>
