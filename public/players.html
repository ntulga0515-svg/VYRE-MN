<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players — VYRE.MN</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .page-wrap {
            padding: 45px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -1px;
        }

        .page-header p {
            margin-top: 8px;
            color: #777c86;
        }

        .players-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .search-box {
            width: 320px;
            padding: 13px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.035);
            color: white;
            outline: none;
        }

        .search-box:focus {
            border-color: rgba(255,255,255,.2);
        }

        .players-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,.025);
        }

        .players-table th {
            text-align: left;
            padding: 16px 18px;
            font-size: 12px;
            color: #707580;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .players-table td {
            padding: 17px 18px;
            border-bottom: 1px solid rgba(255,255,255,.045);
            color: #d7d9de;
        }

        .players-table tr:last-child td {
            border-bottom: none;
        }

        .players-table tr:hover td {
            background: rgba(255,255,255,.025);
        }

        .player-name {
            font-weight: 700;
            color: white;
        }

        .steam-id {
            color: #777c86;
            font-family: monospace;
            font-size: 13px;
        }

        .rank {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 800;
        }

        .rank.PLAYER {
            background: rgba(255,255,255,.07);
            color: #aaa;
        }

        .rank.VIP {
            background: rgba(255,200,70,.12);
            color: #e7b83e;
        }

        .rank.ADMIN {
            background: rgba(90,150,255,.12);
            color: #6da1ff;
        }

        .rank.BOSS {
            background: rgba(255,70,70,.12);
            color: #ff6969;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
            color: #686d77;
        }

        @media (max-width: 800px) {
            .page-wrap {
                padding: 25px;
            }

            .players-tools {
                display: block;
            }

            .search-box {
                width: 100%;
                margin-top: 15px;
            }
        }
    </style>
    <script>document.documentElement.classList.add('js')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#05060a">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/polish.css">
</head>

<body>

<div class="bg-glow"></div>

<aside class="sidebar" id="sidebar">

        <span class="brand-mark">V</span>
        <span class="brand-word"><span>VYRE</span><b>.MN</b></span>
    </a>

    <div class="brand-line"></div>

    <nav>
        <a class="nav-item" href="/"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span class="lbl">HOME</span></a>
        <a class="nav-item" href="/servers"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></span><span class="lbl">SERVERS</span></a>
        <a class="nav-item" href="/skins"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 6-9 14L3 8z"/><path d="M3 8h18M12 2v20M8 8l4 14 4-14"/></svg></span><span class="lbl">SKINCHANGER</span></a>
        <a class="nav-item" href="/leaderboard"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 21h8M10 18h4"/></svg></span><span class="lbl">LEADERBOARD</span></a>
        <a class="nav-item active" href="/players" aria-current="page"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18.5 14.4c1.9.8 3 2.7 3 5.6"/></svg></span><span class="lbl">PLAYERS</span></a>
        <a class="nav-item" href="/clans"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg></span><span class="lbl">CLANS</span></a>

    </nav>

    <div class="sidebar-bottom">

        <div class="system-status">
            <i></i>
            <div>
                <strong>VYRE NETWORK</strong>

            </div>
        </div>

        <button class="steam-login" type="button" onclick="steamLogin()">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="15.5" cy="9.5" r="2.5"/><path d="M3 12.6l5.2 2.1M9.5 17a2 2 0 100-4 2 2 0 000 4z"/></svg></span>
            <b class="steam-label">STEAM LOGIN</b>
        </button>

    </div>

</aside>


<main class="main">

    <header class="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
        <div>
            <span class="top-live"></span>
            MONGOLIA
        </div>

        <div>
            26 SERVERS ONLINE
        </div>
    </header>


    <div class="page-wrap">

        <div class="page-header">

            <h1>PLAYERS</h1>

            <p>
                VYRE.MN community players
            </p>

        </div>


        <div class="players-tools">

            <div></div>

            <input
                id="search"
                class="search-box"
                type="text"
                placeholder="Search player..."
            >

        </div>


        <table class="players-table">

            <thead>

                <tr>
                    <th>#</th>
                    <th>PLAYER</th>
                    <th>STEAM ID</th>
                    <th>RANK</th>
                </tr>

            </thead>

            <tbody id="playersBody">

                <tr>
                    <td colspan="4" class="empty">
                        Loading players...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script>

let players = [];


async function loadPlayers() {

    const body =
        document.getElementById("playersBody");

    try {

        const response =
            await fetch("/api/players");

        players =
            await response.json();

        renderPlayers(players);

    } catch (error) {

        body.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    Failed to load players.
                </td>
            </tr>
        `;

    }

}


function renderPlayers(list) {

    const body =
        document.getElementById("playersBody");

    if (!list.length) {

        body.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    No players yet.
                </td>
            </tr>
        `;

        return;
    }


    body.innerHTML =
        list.map((player, index) => {

            const rank =
                player.rank || "PLAYER";

            return `
                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <span class="player-name">
                            ${escapeHtml(player.name)}
                        </span>
                    </td>

                    <td>
                        <span class="steam-id">
                            ${escapeHtml(player.steam_id || "-")}
                        </span>
                    </td>

                    <td>
                        <span class="rank ${rank}">
                            ${rank}
                        </span>
                    </td>

                </tr>
            `;

        }).join("");

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


document
    .getElementById("search")
    .addEventListener("input", function () {

        const query =
            this.value
                .toLowerCase()
                .trim();

        const filtered =
            players.filter(player => {

                return (
                    String(player.name || "")
                        .toLowerCase()
                        .includes(query)

                    ||

                    String(player.steam_id || "")
                        .toLowerCase()
                        .includes(query)
                );

            });

        renderPlayers(filtered);

    });


loadPlayers();

</script>

<script src="/auth.js"></script>
<script src="/fx.js" defer></script>
</body>
</html>
