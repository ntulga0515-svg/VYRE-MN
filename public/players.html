<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players — VYRE.MN</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .page-wrap {
            padding: 45px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -1px;
        }

        .page-header p {
            margin-top: 8px;
            color: #777c86;
        }

        .players-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .search-box {
            width: 320px;
            padding: 13px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.035);
            color: white;
            outline: none;
        }

        .search-box:focus {
            border-color: rgba(255,255,255,.2);
        }

        .players-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,.025);
        }

        .players-table th {
            text-align: left;
            padding: 16px 18px;
            font-size: 12px;
            color: #707580;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .players-table td {
            padding: 17px 18px;
            border-bottom: 1px solid rgba(255,255,255,.045);
            color: #d7d9de;
        }

        .players-table tr:last-child td {
            border-bottom: none;
        }

        .players-table tr:hover td {
            background: rgba(255,255,255,.025);
        }

        .player-name {
            font-weight: 700;
            color: white;
        }

        .steam-id {
            color: #777c86;
            font-family: monospace;
            font-size: 13px;
        }

        .rank {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 800;
        }

        .rank.PLAYER {
            background: rgba(255,255,255,.07);
            color: #aaa;
        }

        .rank.VIP {
            background: rgba(255,200,70,.12);
            color: #e7b83e;
        }

        .rank.ADMIN {
            background: rgba(90,150,255,.12);
            color: #6da1ff;
        }

        .rank.BOSS {
            background: rgba(255,70,70,.12);
            color: #ff6969;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
            color: #686d77;
        }

        @media (max-width: 800px) {
            .page-wrap {
                padding: 25px;
            }

            .players-tools {
                display: block;
            }

            .search-box {
                width: 100%;
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

<div class="bg-glow"></div>

<aside class="sidebar">

    <div class="brand">
        <span>VYRE</span><b>.MN</b>
    </div>

    <div class="brand-line"></div>

    <nav>

        <a class="nav-item" href="/">
            ⌂ HOME
        </a>

        <a class="nav-item" href="/servers">
            ▣ SERVERS
        </a>

        <a class="nav-item" href="/skins">
            ◈ SKINCHANGER
        </a>

        <a class="nav-item" href="/leaderboard">
            ♛ LEADERBOARD
        </a>

        <a class="nav-item active" href="/players">
            ◉ PLAYERS
        </a>

        <a class="nav-item" href="/clans">
            ◆ CLANS
        </a>

        <a class="nav-item" href="/discord">
            ◌ DISCORD
        </a>

    </nav>

    <div class="sidebar-bottom">

        <div class="system-status">
            <i></i>
            <div>
                <strong>ALL SYSTEMS</strong>
                <small>OPERATIONAL</small>
            </div>
        </div>

        <button class="steam-login" onclick="steamLogin()">
            ◉ STEAM LOGIN
        </button>

    </div>

</aside>


<main class="main">

    <header class="topbar">
        <div>
            <span class="top-live"></span>
            MONGOLIA
        </div>

        <div>
            26 SERVERS ONLINE
        </div>
    </header>


    <div class="page-wrap">

        <div class="page-header">

            <h1>PLAYERS</h1>

            <p>
                VYRE.MN community players
            </p>

        </div>


        <div class="players-tools">

            <div></div>

            <input
                id="search"
                class="search-box"
                type="text"
                placeholder="Search player..."
            >

        </div>


        <table class="players-table">

            <thead>

                <tr>
                    <th>#</th>
                    <th>PLAYER</th>
                    <th>STEAM ID</th>
                    <th>RANK</th>
                </tr>

            </thead>

            <tbody id="playersBody">

                <tr>
                    <td colspan="4" class="empty">
                        Loading players...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script>

let players = [];


async function loadPlayers() {

    const body =
        document.getElementById("playersBody");

    try {

        const response =
            await fetch("/api/players");

        players =
            await response.json();

        renderPlayers(players);

    } catch (error) {

        body.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    Failed to load players.
                </td>
            </tr>
        `;

    }

}


function renderPlayers(list) {

    const body =
        document.getElementById("playersBody");

    if (!list.length) {

        body.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    No players yet.
                </td>
            </tr>
        `;

        return;
    }


    body.innerHTML =
        list.map((player, index) => {

            const rank =
                player.rank || "PLAYER";

            return `
                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <span class="player-name">
                            ${escapeHtml(player.name)}
                        </span>
                    </td>

                    <td>
                        <span class="steam-id">
                            ${escapeHtml(player.steam_id || "-")}
                        </span>
                    </td>

                    <td>
                        <span class="rank ${rank}">
                            ${rank}
                        </span>
                    </td>

                </tr>
            `;

        }).join("");

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


document
    .getElementById("search")
    .addEventListener("input", function () {

        const query =
            this.value
                .toLowerCase()
                .trim();

        const filtered =
            players.filter(player => {

                return (
                    String(player.name || "")
                        .toLowerCase()
                        .includes(query)

                    ||

                    String(player.steam_id || "")
                        .toLowerCase()
                        .includes(query)
                );

            });

        renderPlayers(filtered);

    });


loadPlayers();

</script>

</body>
</html>
