<style>
.srv-wrap{padding:30px 40px 60px}
.srv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.srv-head h1{font-size:26px;letter-spacing:-.5px}
.srv-tabs{display:flex;gap:6px}
.srv-tab{height:34px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#0e1219;color:#858b98;font-size:11px;font-weight:800;cursor:pointer}
.srv-tab.active,.srv-tab:hover{background:#1a2030;color:#fff;border-color:rgba(255,255,255,.18)}
.srv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.srv-card{position:relative;height:118px;border-radius:12px;overflow:hidden;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.06)}
.srv-card::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,16,.72),rgba(8,10,16,.25))}
.srv-body{position:absolute;left:14px;top:12px;right:14px;z-index:2}
.srv-name{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.srv-copy{width:18px;height:18px;border:0;background:transparent;color:#fff;cursor:pointer;font-size:14px;opacity:.85;padding:0}
.srv-copy:hover{opacity:1}
.srv-status{margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.5px}
.srv-status.live{color:#5dff8d}
.srv-status.waiting{color:#ffb545}
.srv-status.offline{color:#8b92a0}
.srv-meta{margin-top:7px;font-size:12px;color:#e6e8ee}
.srv-meta b{margin-left:8px;font-weight:600}
.srv-play{position:absolute;right:14px;top:50%;transform:translateY(-60%);z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(4px)}
.srv-play:hover{background:rgba(255,255,255,.4)}
.srv-bar{position:absolute;left:14px;right:14px;bottom:12px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);z-index:2;overflow:hidden}
.srv-bar i{display:block;height:100%;background:#ff4a3d;border-radius:4px}
.srv-bar i.mid{background:#f2b632}
.srv-empty{grid-column:1/-1;padding:60px;text-align:center;color:#858b98;border:1px dashed var(--line);border-radius:12px;font-size:13px}
@media(max-width:1300px){.srv-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){.srv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.srv-wrap{padding:24px 20px}}
@media(max-width:600px){.srv-grid{grid-template-columns:1fr}}
</style>
    <script>document.documentElement.classList.add('js')</script>

<script src="/auth.js"></script>
<script>
let SRV = [], FILTER = "all";

function mapBg(map) {
    let h = 0;
    for (const c of (map || "x")) h = (h * 31 + c.charCodeAt(0)) % 360;
    const grad = "linear-gradient(135deg,hsl(" + h + ",35%,22%),hsl(" + ((h + 40) % 360) + ",40%,12%))";
    if (!map) return grad;
    return "url('/maps/" + map + ".jpg')," + grad;
}

function esc(t) {
    return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function copyIp(ip, port) {
    const text = "connect " + ip + ":" + port;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
        .then(() => (window.vyreNotify ? vyreNotify("Copied: " + text) : alert("Copied: " + text)))
        .catch(() => prompt("Copy this:", text));
}

function play(ip, port) {
    location.href = "steam://connect/" + ip + ":" + port;
}

function render() {
    const online = SRV.filter(s => s.status !== "offline").length;
    document.getElementById("srvCount").textContent = online + " / " + SRV.length + " SERVERS ONLINE";

    const list = SRV.filter(s => FILTER === "all" || s.status === FILTER);
    const grid = document.getElementById("srvGrid");

    if (!list.length) {
        grid.innerHTML = '<div class="srv-empty">Server олдсонгүй.</div>';
        return;
    }

    grid.innerHTML = list.map(s => {
        const label = s.status === "offline" ? "OFFLINE"
            : s.status === "waiting" ? "WAITING!"
            : "LIVE!" + (s.score ? " [" + s.score[0] + " - " + s.score[1] + "]" : "");
        const pct = s.max ? Math.round(s.players / s.max * 100) : 0;
        return `
        <div class="srv-card" style="background-image:${mapBg(s.map)}">
            <div class="srv-body">
                <div class="srv-name">${esc(s.name)}
                    <button class="srv-copy" title="Copy IP" onclick="copyIp('${esc(s.ip)}',${s.port})">⧉</button>
                </div>
                <div class="srv-status ${s.status}">${label}</div>
                <div class="srv-meta">${s.max ? s.players + "/" + s.max : "-"}<b>${esc(s.map || "-")}</b></div>
            </div>
            <button class="srv-play" title="Connect" onclick="play('${esc(s.ip)}',${s.port})">▶</button>
            <div class="srv-bar"><i class="${pct < 60 ? "mid" : ""}" style="width:${pct}%"></i></div>
        </div>`;
    }).join("");
}

async function loadServers() {
    try {
        SRV = await fetch("/api/servers/live").then(r => r.json());
        render();
    } catch (e) {
        document.getElementById("srvGrid").innerHTML = '<div class="srv-empty">Server-ийн мэдээлэл ачаалж чадсангүй.</div>';
    }
}

document.querySelectorAll(".srv-tab").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".srv-tab").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    FILTER = b.dataset.f;
    render();
}));

loadServers();
setInterval(loadServers, 10000);
</script>

<script src="/fx.js" defer></script>
