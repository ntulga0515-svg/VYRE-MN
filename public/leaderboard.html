<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — VYRE.MN</title>
    <link rel="stylesheet" href="/style.css">

    <style>

        .page-wrap {
            padding: 45px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -1px;
        }

        .page-header p {
            margin-top: 8px;
            color: #777c86;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,.025);
        }

        .leaderboard-table th {
            text-align: left;
            padding: 16px 18px;
            font-size: 12px;
            color: #707580;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .leaderboard-table td {
            padding: 18px;
            border-bottom: 1px solid rgba(255,255,255,.045);
            color: #d7d9de;
        }

        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }

        .leaderboard-table tr:hover td {
            background: rgba(255,255,255,.025);
        }

        .position {
            color: #666b75;
            font-weight: 700;
            width: 60px;
        }

        .player-name {
            color: white;
            font-weight: 800;
        }

        .score {
            color: white;
            font-weight: 800;
        }

        .stat {
            color: #8b909a;
        }

        .empty {
            text-align: center;
            padding: 75px 20px !important;
            color: #686d77 !important;
        }

        @media (max-width: 800px) {

            .page-wrap {
                padding: 25px;
            }

            .leaderboard-table {
                font-size: 13px;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 13px 10px;
            }

        }

    </style>
</head>

<body>

<div class="bg-glow"></div>

<aside class="sidebar">

    <div class="brand">
        <span>VYRE</span><b>.MN</b>
    </div>

    <div class="brand-line"></div>

    <nav>

        <a class="nav-item" href="/">
            ⌂ HOME
        </a>

        <a class="nav-item" href="/servers">
            ▣ SERVERS
        </a>

        <a class="nav-item" href="/skins">
            ◈ SKINCHANGER
        </a>

        <a class="nav-item active" href="/leaderboard">
            ♛ LEADERBOARD
        </a>

        <a class="nav-item" href="/players">
            ◉ PLAYERS
        </a>

        <a class="nav-item" href="/clans">
            ◆ CLANS
        </a>

        <a class="nav-item" href="/discord">
            ◌ DISCORD
        </a>

    </nav>

    <div class="sidebar-bottom">

        <div class="system-status">
            <i></i>

            <div>
                <strong>ALL SYSTEMS</strong>
                <small>OPERATIONAL</small>
            </div>
        </div>

        <button
            class="steam-login"
            onclick="steamLogin()"
        >
            ◉ STEAM LOGIN
        </button>

    </div>

</aside>


<main class="main">

    <header class="topbar">

        <div>
            <span class="top-live"></span>
            MONGOLIA
        </div>

        <div>
            26 SERVERS ONLINE
        </div>

    </header>


    <div class="page-wrap">

        <div class="page-header">

            <h1>LEADERBOARD</h1>

            <p>
                VYRE.MN competitive rankings
            </p>

        </div>


        <table class="leaderboard-table">

            <thead>

                <tr>
                    <th>#</th>
                    <th>PLAYER</th>
                    <th>SCORE</th>
                    <th>KILLS</th>
                    <th>WINS</th>
                </tr>

            </thead>


            <tbody id="leaderboardBody">

                <tr>
                    <td colspan="5" class="empty">
                        Loading leaderboard...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script>

async function loadLeaderboard() {

    const body =
        document.getElementById("leaderboardBody");

    try {

        const response =
            await fetch("/api/players");

        const players =
            await response.json();


        if (!players.length) {

            body.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        No leaderboard data yet.
                    </td>
                </tr>
            `;

            return;
        }


        body.innerHTML =
            players.map((player, index) => {

                return `
                    <tr>

                        <td class="position">
                            #${index + 1}
                        </td>

                        <td>
                            <span class="player-name">
                                ${escapeHtml(player.name)}
                            </span>
                        </td>

                        <td>
                            <span class="score">
                                0
                            </span>
                        </td>

                        <td>
                            <span class="stat">
                                0
                            </span>
                        </td>

                        <td>
                            <span class="stat">
                                0
                            </span>
                        </td>

                    </tr>
                `;

            }).join("");


    } catch (error) {

        body.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Failed to load leaderboard.
                </td>
            </tr>
        `;

    }

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadLeaderboard();

</script>

</body>
</html>
