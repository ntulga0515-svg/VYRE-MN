<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — VYRE.MN</title>
    <link rel="stylesheet" href="/style.css">

    <style>

        .page-wrap {
            padding: 45px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: -1px;
        }

        .page-header p {
            margin-top: 8px;
            color: #777c86;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,.025);
        }

        .leaderboard-table th {
            text-align: left;
            padding: 16px 18px;
            font-size: 12px;
            color: #707580;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .leaderboard-table td {
            padding: 18px;
            border-bottom: 1px solid rgba(255,255,255,.045);
            color: #d7d9de;
        }

        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }

        .leaderboard-table tr:hover td {
            background: rgba(255,255,255,.025);
        }

        .position {
            color: #666b75;
            font-weight: 700;
            width: 60px;
        }

        .player-name {
            color: white;
            font-weight: 800;
        }

        .score {
            color: white;
            font-weight: 800;
        }

        .stat {
            color: #8b909a;
        }

        .empty {
            text-align: center;
            padding: 75px 20px !important;
            color: #686d77 !important;
        }

        @media (max-width: 800px) {

            .page-wrap {
                padding: 25px;
            }

            .leaderboard-table {
                font-size: 13px;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 13px 10px;
            }

        }

    </style>
    <script>document.documentElement.classList.add('js')</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#05060a">
    <link rel="stylesheet" href="/theme.css">
</head>

<body>

<div class="bg-glow"></div>

<aside class="sidebar" id="sidebar">

        <span class="brand-word"><span>VYRE</span><b>.MN</b></span>
    </a>

    <div class="brand-line"></div>

    <nav>
        <a class="nav-item" href="/"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span class="lbl">HOME</span></a>
        <a class="nav-item" href="/servers"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></span><span class="lbl">SERVERS</span></a>
        <a class="nav-item" href="/skins"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 6-9 14L3 8z"/><path d="M3 8h18M12 2v20M8 8l4 14 4-14"/></svg></span><span class="lbl">SKINCHANGER</span></a>
        <a class="nav-item active" href="/leaderboard" aria-current="page"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 21h8M10 18h4"/></svg></span><span class="lbl">LEADERBOARD</span></a>
        <a class="nav-item" href="/players"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18.5 14.4c1.9.8 3 2.7 3 5.6"/></svg></span><span class="lbl">PLAYERS</span></a>

    </nav>

    <div class="sidebar-bottom">

        <div class="system-status">
            <i></i>
            <div>
                <strong>VYRE NETWORK</strong>
                <small>ONLINE</small>
            </div>
        </div>

        <button class="steam-login" type="button" onclick="steamLogin()">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="15.5" cy="9.5" r="2.5"/><path d="M3 12.6l5.2 2.1M9.5 17a2 2 0 100-4 2 2 0 000 4z"/></svg></span>
            <b class="steam-label">STEAM LOGIN</b>
        </button>

</aside>


<main class="main">

    <header class="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>

        <div>
            <span class="top-live"></span>
            MONGOLIA
        </div>

        <div>
            26 SERVERS ONLINE
        </div>

    </header>


    <div class="page-wrap">

        <div class="page-header">

            <h1>LEADERBOARD</h1>

            <p>
                VYRE.MN competitive rankings
            </p>

        </div>


        <table class="leaderboard-table">

            <thead>

                <tr>
                    <th>#</th>
                    <th>PLAYER</th>
                    <th>SCORE</th>
                    <th>KILLS</th>
                    <th>WINS</th>
                </tr>

            </thead>


            <tbody id="leaderboardBody">

                <tr>
                    <td colspan="5" class="empty">
                        Loading leaderboard...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<script>

async function loadLeaderboard() {

    const body =
        document.getElementById("leaderboardBody");

    try {

        const response =
            await fetch("/api/players");

        const players =
            await response.json();


        if (!players.length) {

            body.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        No leaderboard data yet.
                    </td>
                </tr>
            `;

            return;
        }


        body.innerHTML =
            players.map((player, index) => {

                return `
                    <tr>

                        <td class="position">
                            #${index + 1}
                        </td>

                        <td>
                            <span class="player-name">
                                ${escapeHtml(player.name)}
                            </span>
                        </td>

                        <td>
                            <span class="score">
                                0
                            </span>
                        </td>

                        <td>
                            <span class="stat">
                                0
                            </span>
                        </td>

                        <td>
                            <span class="stat">
                                0
                            </span>
                        </td>

                    </tr>
                `;

            }).join("");


    } catch (error) {

        body.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Failed to load leaderboard.
                </td>
            </tr>
        `;

    }

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


loadLeaderboard();

</script>

<script src="/auth.js"></script>
<script src="/fx.js" defer></script>
</body>
</html>
