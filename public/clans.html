<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clans — VYRE.MN</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .clans-page {
            padding: 45px;
        }

        .page-header {
            margin-bottom: 35px;
        }

        .page-header .eyebrow {
            font-size: 11px;
            letter-spacing: 3px;
            color: #777c86;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 42px;
            line-height: 1;
            letter-spacing: -1.5px;
        }

        .page-header h1 span {
            color: #777c86;
        }

        .page-header p {
            margin-top: 14px;
            color: #777c86;
            font-size: 14px;
        }

        .clan-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .clan-count {
            color: #777c86;
            font-size: 13px;
        }

        .create-clan {
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.045);
            color: white;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            transition: .2s;
        }

        .create-clan:hover {
            background: rgba(255,255,255,.08);
            transform: translateY(-1px);
        }

        .clan-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .clan-card {
            position: relative;
            padding: 24px;
            min-height: 190px;

            border: 1px solid rgba(255,255,255,.07);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.015)
                );

            border-radius: 12px;
            transition: .2s;
        }

        .clan-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,.14);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.065),
                    rgba(255,255,255,.02)
                );
        }

        .clan-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .clan-logo {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.08);

            font-size: 17px;
            font-weight: 900;
            color: white;
        }

        .clan-tag {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #777c86;
        }

        .clan-card h3 {
            margin: 0;
            font-size: 20px;
            color: white;
        }

        .clan-card p {
            margin: 7px 0 20px;
            color: #777c86;
            font-size: 12px;
        }

        .clan-info {
            display: flex;
            gap: 25px;
        }

        .clan-stat strong {
            display: block;
            color: white;
            font-size: 14px;
        }

        .clan-stat span {
            display: block;
            margin-top: 3px;
            color: #60656e;
            font-size: 10px;
            letter-spacing: .7px;
        }

        .empty-clans {
            grid-column: 1 / -1;

            padding: 80px 20px;

            text-align: center;

            border: 1px dashed rgba(255,255,255,.08);
            border-radius: 12px;

            color: #666b75;
        }

        .empty-clans strong {
            display: block;
            color: #969ba4;
            font-size: 16px;
            margin-bottom: 8px;
        }

        @media (max-width: 1000px) {
            .clan-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .clans-page {
                padding: 25px;
            }

            .clan-grid {
                grid-template-columns: 1fr;
            }

            .clan-actions {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }
        }
    </style>
    <script>document.documentElement.classList.add('js')</script>
