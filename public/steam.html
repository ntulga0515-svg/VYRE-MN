<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — VYRE.MN</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex,follow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@500;700&display=swap');
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--red:#ff2e4d;--blue:#3d7bff;--violet:#8b5cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#05060b;color:#eef1f8;font-family:Manrope,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(40% 45% at 20% 25%,rgba(255,46,77,.28),transparent 70%),radial-gradient(45% 50% at 80% 75%,rgba(61,123,255,.30),transparent 70%),radial-gradient(30% 35% at 50% 50%,rgba(139,92,255,.16),transparent 70%);background-size:150% 150%;animation:mesh 14s ease-in-out infinite alternate}
@keyframes mesh{to{background-position:40% 30%,60% 70%,30% 60%}}
.rings{position:fixed;left:50%;top:50%;width:0;height:0}
.rings i{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.07);transform:translate(-50%,-50%);animation:orbit linear infinite}
.rings i::after{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 20px var(--c)}
.rings i:nth-child(1){width:520px;height:520px;--c:var(--red);animation-duration:14s}
.rings i:nth-child(2){width:760px;height:760px;--c:var(--blue);animation-duration:22s;animation-direction:reverse}
.rings i:nth-child(3){width:1040px;height:1040px;--c:var(--violet);animation-duration:34s}
@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}
.card{position:relative;z-index:2;width:min(92vw,440px);padding:44px 34px 32px;text-align:center;border-radius:32px;
 border:1px solid transparent;background:linear-gradient(#0b0e18ee,#0b0e18ee) padding-box,conic-gradient(from var(--a),var(--red),var(--blue),var(--violet),var(--red)) border-box;
 animation:spin 6s linear infinite,pop .8s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 40px 100px -30px #000;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
@keyframes spin{to{--a:360deg}}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(10px)}}
.logo{width:76px;height:76px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;font:800 40px "Bricolage Grotesque",sans-serif;background:linear-gradient(135deg,var(--red),var(--blue));box-shadow:0 0 50px rgba(255,46,77,.5),0 0 70px rgba(61,123,255,.4);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
h1{font:800 clamp(2rem,6vw,2.8rem)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.05em;background:linear-gradient(90deg,#fff,#aab3c8);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:14px 0 28px;color:#98a1b6;line-height:1.6;font-size:.95rem}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;border:0;border-radius:999px;font:700 15px Manrope,sans-serif;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s,box-shadow .3s}
.btn+.btn{margin-top:12px}
.btn:hover{transform:translateY(-3px)}
.btn::after{content:"";position:absolute;inset:0;transform:translateX(-120%) skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:transform .7s}
.btn:hover::after{transform:translateX(120%) skewX(-20deg)}
.steam{background:linear-gradient(100deg,#1b4fd6,var(--blue));box-shadow:0 14px 40px -12px rgba(61,123,255,.8)}
.discord{background:linear-gradient(100deg,#4f46e5,#5865f2);box-shadow:0 14px 40px -12px rgba(88,101,242,.8)}
.btn svg{width:20px;height:20px;fill:currentColor}
.toast{min-height:20px;margin-top:16px;font-size:.85rem;color:#ffb3bd}
.back{display:inline-block;margin-top:14px;color:#8d97ad;text-decoration:none;font-size:.9rem;transition:color .25s,letter-spacing .3s}
.back:hover{color:#fff;letter-spacing:.06em}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="card">
  <div class="logo">V</div>
  <h1>Welcome back</h1>
  <p>Sign in to unlock your profile, skins, rank and clan on VYRE.MN.</p>
  <button class="btn steam" onclick="location.href='/api/auth/steam'">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.96 9.1l5.35 2.2a2.8 2.8 0 0 1 1.6-.5h.15l2.4-3.45v-.05a3.7 3.7 0 1 1 3.7 3.7h-.1l-3.4 2.45a2.8 2.8 0 0 1-5.55.3L2.3 14A10 10 0 1 0 12 2z"/></svg>
    Sign in with Steam</button>
  <button class="btn discord" id="dc">
    <svg viewBox="0 0 24 24"><path d="M20 5a17 17 0 0 0-4.2-1.3l-.5 1a15 15 0 0 0-4.6 0l-.5-1A17 17 0 0 0 4 5C1.4 9 .7 12.800 1 16.600A17 17 0 0 0 6.200 19l1-1.600a11 11 0 0 1-1.700-.8l.4-.3a12 12 0 0 0 10.200 0l.4.300c-.5.300-1.100.6-1.700.8l1 1.600a17 17 0 0 0 5.200-2.400C23.300 12.300 22.200 8.500 20 5zM8.700 14.400c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm6.600 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg>
    Continue with Discord</button>
  <div class="toast" id="t" role="status"></div>
  <a class="back" href="/">← Back to VYRE.MN</a>
</main>
<script>
document.getElementById("dc").onclick=function(){
  var t=document.getElementById("t");
  fetch("/api/auth/discord",{method:"HEAD",redirect:"manual"}).then(function(r){
    if(r.status===404){t.textContent="Discord login is not set up on the server yet.";}
    else{location.href="/api/auth/discord";}
  }).catch(function(){t.textContent="Could not reach the server.";});
};
</script>
</body>
</html>
